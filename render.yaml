services:
  - type: web
    name: transformer-summarizer-api
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt && pip install -e .
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SUMMARIZER_MODEL_PATH
        value: /opt/render/project/src/artifacts/model.pt
      - key: SUMMARIZER_TOKENIZER_PATH
        value: /opt/render/project/src/artifacts/tokenizer.json
      - key: SUMMARIZER_MAX_INPUT_LENGTH
        value: 512
      - key: SUMMARIZER_MAX_OUTPUT_LENGTH
        value: 128

